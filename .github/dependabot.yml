version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns:
          - org.springframework.boot:*

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
      day: "1"
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
